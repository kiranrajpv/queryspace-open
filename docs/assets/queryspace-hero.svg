<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">QuerySpace</title>
  <desc id="description">Query local data with DuckDB and Parquet on Windows.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#073763"/>
      <stop offset="0.55" stop-color="#0b5fa5"/>
      <stop offset="1" stop-color="#0a7f83"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ce7e1"/>
      <stop offset="1" stop-color="#d9fff8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#00182d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#background)"/>
  <circle cx="1075" cy="-20" r="210" fill="#65d7cf" opacity="0.10"/>
  <circle cx="1140" cy="285" r="150" fill="#ffffff" opacity="0.06"/>
  <path d="M0 280 C220 225 390 330 625 274 C820 228 1010 246 1200 196 L1200 340 L0 340 Z" fill="#031e36" opacity="0.18"/>

  <g transform="translate(72 66)" filter="url(#shadow)">
    <rect width="184" height="184" rx="42" fill="#062b4e" stroke="#7ce0d9" stroke-width="3"/>
    <ellipse cx="75" cy="57" rx="42" ry="17" fill="none" stroke="url(#accent)" stroke-width="7"/>
    <path d="M33 57v66c0 10 19 18 42 18s42-8 42-18V57" fill="none" stroke="url(#accent)" stroke-width="7"/>
    <path d="M33 88c0 10 19 18 42 18s42-8 42-18M33 118c0 10 19 18 42 18 10 0 20-2 27-5" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <rect x="105" y="104" width="58" height="48" rx="12" fill="#0b5fa5" stroke="#ffffff" stroke-width="4"/>
    <path d="M119 120l10 9-10 9M135 139h15" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(300 72)" fill="#ffffff">
    <text x="0" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2">QuerySpace</text>
    <text x="2" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#d9f6f3">Local data. Fast SQL. Private by design.</text>
    <text x="2" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#b9dbea">Explore files, build extracts, and analyze Parquet with embedded DuckDB.</text>
  </g>

  <g transform="translate(302 252)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">
    <g><rect width="104" height="36" rx="18" fill="#ffffff" opacity="0.14"/><text x="52" y="23" text-anchor="middle" fill="#ffffff">DuckDB</text></g>
    <g transform="translate(118 0)"><rect width="104" height="36" rx="18" fill="#ffffff" opacity="0.14"/><text x="52" y="23" text-anchor="middle" fill="#ffffff">Parquet</text></g>
    <g transform="translate(236 0)"><rect width="104" height="36" rx="18" fill="#ffffff" opacity="0.14"/><text x="52" y="23" text-anchor="middle" fill="#ffffff">Windows</text></g>
    <g transform="translate(354 0)"><rect width="104" height="36" rx="18" fill="#ffffff" opacity="0.14"/><text x="52" y="23" text-anchor="middle" fill="#ffffff">.NET 9</text></g>
  </g>
</svg>
